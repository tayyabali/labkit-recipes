/* LabKit Recipes: mobile first. Base styles are for a phone; wider screens only add. */
:root {
  --bg: #f3f6f7;
  --card: #ffffff;
  --text: #17222b;

  --accent-text: #ffffff;
  --accent-soft: #e0f2f0;
  --ok: #1b7f4b;
  --ok-soft: #e2f5ea;
  --warn: #8a5a00;
  --warn-soft: #fff3d6;
  --bad: #b3261e;
  --bad-soft: #fdeceb;
  --shadow: 0 1px 2px rgba(15, 30, 40, 0.08), 0 4px 14px rgba(15, 30, 40, 0.06);
  --tab-h: 62px;

  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);

:root[data-theme="dark"] {

  --accent: #3cc4bb; --accent-text: #08201e; --accent-soft: #14312f;
  --ok: #5fd195; --ok-soft: #12301f; --warn: #f2c25c; --warn-soft: #3a2f14; --bad: #ff8d84; --bad-soft: #3b1d1b;

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }

h1, h2, h3 { line-height: 1.2; margin: 0 0 8px; }
h1 { font-size: 1.45rem; } h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
p { margin: 0 0 10px; }

.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ----- app shell: top bar, scrolling view, bottom tabs ----- */
#shell { min-height: 100dvh; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; background: var(--bg); }
.appbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 4px; min-height: calc(var(--bar-h) + var(--safe-t)); padding: var(--safe-t) 8px 0; background: var(--accent); color: var(--accent-text); }
.appbar h1 { flex: 1; margin: 0; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
.appbar .icon-btn { color: var(--accent-text); }
main#view { flex: 1; padding: 14px 14px calc(var(--tab-h) + var(--safe-b) + 90px); outline: none; }
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 25; width: 100%; max-width: 760px; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--card); border-top: 1px solid var(--border); padding-bottom: var(--safe-b); box-shadow: 0 -2px 10px rgba(15, 30, 40, 0.06); }
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: var(--tab-h); padding: 6px 2px; color: var(--muted); text-decoration: none; font-size: 0.72rem; font-weight: 600; }
.tabbar a[aria-current="page"] { color: var(--accent); }
.tabbar a[aria-current="page"] svg { stroke-width: 2.5; }

.icon-btn:active { background: rgba(127, 127, 127, 0.18); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }

.btn.danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.small { min-height: 40px; padding: 6px 12px; font-size: 0.9rem; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

textarea { min-height: 110px; resize: vertical; }
input[type="checkbox"], input[type="radio"] { width: 22px; height: 22px; min-height: 0; accent-color: var(--accent); }

.hint { font-size: 0.8rem; color: var(--muted); }

/* ----- cards, lists, badges ----- */

.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.76rem; font-weight: 600; background: var(--accent-soft); color: var(--text); border: 1px solid var(--border); }
.badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.note { margin: 8px 0; padding: 10px 12px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 0.9rem; }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.info { background: var(--accent-soft); color: var(--text); }
.search { position: sticky; top: calc(var(--bar-h) + var(--safe-t)); z-index: 5; padding: 8px 0; background: var(--bg); }
.fab { position: fixed; right: max(16px, calc(50% - 364px)); bottom: calc(var(--tab-h) + var(--safe-b) + 16px); z-index: 24; display: flex; align-items: center; justify-content: center; width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: var(--accent-text); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28); text-decoration: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
.chip { min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

.stepper input { text-align: center; font-size: 1.3rem; font-weight: 700; }
.stepper button { height: 52px; }

/* ----- ingredient amounts (the numbers people read at the bench) ----- */
.amounts { display: grid; gap: 8px; }

.amt.warn { border-color: var(--warn); background: var(--warn-soft); }

/* ----- sheets (bottom dialogs) ----- */
dialog.sheet { margin: auto auto 0; width: 100%; max-width: 760px; max-height: 88dvh; padding: 0; border: 0; border-radius: 22px 22px 0 0; background: var(--card); color: var(--text); box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.3); overflow: auto; }

.toast.error { background: var(--bad); }
.toast-action { border: 0; background: transparent; color: #8be6dc; font: inherit; font-weight: 700; min-height: 36px; padding: 0 6px; cursor: pointer; }

body.bench-mode .tabbar { display: none; }
body.bench-mode main#view { padding-bottom: 150px; }
.bench-dots { display: flex; gap: 6px; justify-content: center; margin: 4px 0 14px; }
.bench-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
.bench-dots i.done { background: var(--accent); }
.bench-dots i.now { background: var(--accent); transform: scale(1.5); }
.bench-name { font-size: 1.5rem; font-weight: 800; text-align: center; }
.bench-sub { text-align: center; color: var(--muted); margin-bottom: 14px; }
.bench-target { text-align: center; padding: 18px 8px; margin: 10px 0; border-radius: 20px; background: var(--accent-soft); border: 2px solid var(--accent); }
.bench-target .big { font-size: 3rem; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; }
.bench-target .range { color: var(--muted); font-size: 0.95rem; margin-top: 4px; }
.bench-input { display: grid; grid-template-columns: 1fr 100px; gap: 8px; margin: 12px 0; }
.bench-input input { font-size: 2rem; font-weight: 800; text-align: center; min-height: 64px; }
.bench-input select { font-size: 1.1rem; min-height: 64px; }
.feedback { text-align: center; padding: 14px; border-radius: 16px; font-weight: 700; font-size: 1.05rem; margin: 8px 0; background: var(--card); border: 1px solid var(--border); }
.feedback.perfect, .feedback.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.feedback.near { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.feedback.off { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.feedback small { display: block; font-weight: 500; opacity: 0.9; }
.option { display: block; width: 100%; text-align: left; padding: 14px; margin-bottom: 10px; border: 2px solid var(--border); border-radius: 16px; background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
.option:active { border-color: var(--accent); background: var(--accent-soft); }
.option b { display: block; font-size: 1.05rem; }
.option span { color: var(--muted); font-size: 0.88rem; }
.checklist label { display: flex; gap: 12px; align-items: flex-start; padding: 12px 4px; border-bottom: 1px solid var(--border); font-size: 1.02rem; }
.checklist label.done span { text-decoration: line-through; color: var(--muted); }
table.plain { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
table.plain th, table.plain td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
table.plain th { color: var(--muted); font-weight: 600; }
table.plain td.num, table.plain th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scroll-x { overflow-x: auto; }

/* ----- labels (also what gets printed) ----- */
.label-card { width: 100%; max-width: 330px; border: 2px solid #111; border-radius: 6px; padding: 8px 10px; background: #fff; color: #000; font-size: 12px; line-height: 1.3; }
.label-card b.n { display: block; font-size: 15px; }
.label-card .big { font-size: 13px; font-weight: 700; }
.glossary dt { font-weight: 700; margin-top: 12px; }
.glossary dd { margin: 2px 0 0; color: var(--muted); }
.hero { padding: 6px 0 4px; }
.welcome { background: linear-gradient(135deg, var(--accent-soft), var(--card)); border-color: var(--accent); }

/* ----- a little more room on tablets and desktops ----- */
@media (min-width: 700px) {
  main#view { padding-left: 24px; padding-right: 24px; }
  .amounts { grid-template-columns: 1fr 1fr; }
  .bench-target .big { font-size: 3.6rem; }
}

/* ----- printing: only the sheet or label ----- */
@media print {
  :root, :root[data-theme="dark"] { --bg: #fff; --card: #fff; --text: #000; --border: #888; }
  body { background: #fff; }
  .appbar, .tabbar, .actionbar, .fab, #toasts, .no-print { display: none !important; }
  main#view { padding: 0; }
  .card, .item { box-shadow: none; }
  body.print-label .print-sheet-only { display: none !important; }
  body.print-sheet .print-label-only { display: none !important; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

    mixRpm: num(p.mixRpm, 'Mixing speed', { min: 0, max: 30000, int: true }),
    mixMin: num(p.mixMin, 'Mixing time', { min: 0, max: 1000 }),
    cooling: str(p.cooling, 'Cooling', { max: 120 }),
    steps: str(p.steps, 'Method notes', { max: 4000 }),
  };
}
function cleanFormula(input) {
  if (!input || typeof input !== 'object') throw new ValidationError('Formula is invalid.');
  const list = input.ingredients;
  if (!Array.isArray(list) || list.length < 1 || list.length > LIMITS.formulaIngredients) throw new ValidationError(`A formula needs 1 to ${LIMITS.formulaIngredients} ingredients.`);
  return {
    name: str(input.name, 'Name', { required: true, max: 120 }),
    productType: str(input.productType, 'Product type', { max: 40 }),
    description: str(input.description, 'Description', { max: 1000 }),
    batchG: num(input.batchG ?? 100, 'Standard batch size', { min: 0.01, max: 1e7, required: true }),
    ingredients: list.map((x, n) => cleanFormulaIngredient(x, n)),
    process: cleanProcess(input.process),
  };
}
function cleanScores(sc) {
  const out = {};
  for (const m of METRICS) out[m.key] = num(sc && sc[m.key], `${m.label} score`, { min: 1, max: 5, int: true });
  return out;
}
function cleanTrial(t) {
  if (!t || typeof t !== 'object') throw new ValidationError('Trial is invalid.');
  const known = new Set(PROBLEMS.map((p) => p.key));
  const list = t.ingredients;
  if (!Array.isArray(list) || list.length < 1 || list.length > LIMITS.formulaIngredients) throw new ValidationError('A trial needs its ingredient list.');
  return {
    madeAt: typeof t.madeAt === 'string' && !Number.isNaN(Date.parse(t.madeAt)) ? t.madeAt : nowIso(),
    formulaVersion: num(t.formulaVersion ?? 1, 'Version', { min: 1, int: true }) || 1,
    batchG: num(t.batchG, 'Batch size', { min: 0.01, max: 1e7 }),
    ingredients: list.map((x, n) => cleanFormulaIngredient(x, n)),
    process: cleanProcess(t.process),
    scores: cleanScores(t.scores),
    issues: (Array.isArray(t.issues) ? t.issues : []).filter((k) => known.has(k)).slice(0, 12).filter((k, i, a) => a.indexOf(k) === i),
    notes: str(t.notes, 'Notes', { max: 1500 }),
    ph: num(t.ph, 'pH', { min: 0, max: 14 }),
  };
}

const uid = () => (globalThis.crypto && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
const nowIso = () => new Date().toISOString();
const clone = (v) => JSON.parse(JSON.stringify(v));

function emptyData() {
  return {
    schema: SCHEMA,
    settings: { labName: '', initials: '', tolerancePct: 2, theme: 'auto' },
    recipes: [],
    formulas: [],
    batches: [],
    customReagents: [],
    counters: {},
    activeBench: null,
    lastBackup: null,
    flags: { starterOffered: false, welcomed: false },
  };
}

function browserStorage() {
  try {
    const s = globalThis.localStorage;
    const probe = '__lkr_probe__';
    s.setItem(probe, '1');
    s.removeItem(probe);
    return s;
  } catch {
    return null; // blocked (private window, strict settings)
  }
}

function createStore(storage = browserStorage()) {
  let data = emptyData();
  let persistent = !!storage;
  let recovered = false;
  const listeners = new Set();
  let temp = null; // an unsaved "quick make" recipe

  function load() {
    if (!storage) return;
    let raw = null;
    try {
      raw = storage.getItem(KEY);
    } catch {
      persistent = false;
      return;
    }
    if (!raw) return;
    try {
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object' || parsed.schema > SCHEMA) throw new Error('unreadable');
      data = { ...emptyData(), ...parsed, settings: { ...emptyData().settings, ...(parsed.settings || {}) }, flags: { ...emptyData().flags, ...(parsed.flags || {}) } };
    } catch {
      // Keep the damaged copy so nothing is silently destroyed, and start clean.
      try { storage.setItem(`${KEY}:damaged:${Date.now()}`, raw); } catch { /* ignore */ }
      recovered = true;
      data = emptyData();
    }
  }
  load();

    if (storage && persistent) {

    get persistent() { return persistent; },
    get recovered() { return recovered; },
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },

    // ----- settings and flags -----
    settings: () => data.settings,
    setSettings(patch) {
      const s = { ...data.settings };
      if ('labName' in patch) s.labName = str(patch.labName, 'Lab name', { max: 80 });
      if ('initials' in patch) s.initials = str(patch.initials, 'Initials', { max: 8 });
      if ('tolerancePct' in patch) s.tolerancePct = num(patch.tolerancePct, 'Tolerance', { min: 0.1, max: 20, required: true });
      if ('theme' in patch) s.theme = ['auto', 'light', 'dark'].includes(patch.theme) ? patch.theme : 'auto';

    },
    flags: () => data.flags,
    setFlag(k, v) { data.flags = { ...data.flags, [k]: !!v }; save(); },

    // ----- recipes -----
    recipes: () => [...data.recipes].sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' })),
    getRecipe(id) { return id === 'temp' ? temp : data.recipes.find((r) => r.id === id) || null; },
    setTemp(recipe) { temp = recipe ? { ...cleanRecipe(recipe), id: 'temp', version: 1, history: [], createdAt: nowIso(), updatedAt: nowIso() } : null; return temp; },
    saveRecipe(input, id = null) {

      const now = nowIso();

      save();
      return rec;
    },
    restoreVersion(id, version) {
      const cur = data.recipes.find((r) => r.id === id);
      const h = cur && (cur.history || []).find((x) => x.version === version);
      if (!h) throw new ValidationError('That version is not available.');
      return api.saveRecipe(h.snapshot, id); // restoring is itself a new version, so nothing is lost
    },
    duplicateRecipe(id) {

    },
    deleteRecipe(id) {
      const i = data.recipes.findIndex((r) => r.id === id);

      save();
      return gone;
    },
    undeleteRecipe(rec) {

    },

    formulas: () => [...data.formulas].sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' })),
    getFormula: (id) => data.formulas.find((f) => f.id === id) || null,
    saveFormula(input, id = null) {

        const history = [{ version: cur.version, savedAt: cur.updatedAt, snapshot: formulaSnapshot(cur) }, ...(cur.history || [])].slice(0, LIMITS.history);
        Object.assign(cur, clean, { version: cur.version + 1, updatedAt: now, history });
        save();
        return cur;
      }
      if (data.formulas.length >= LIMITS.formulas) throw new ValidationError(`You have reached the limit of ${LIMITS.formulas} formulas.`);

      save();
      return f;
    },
    restoreFormulaVersion(id, version) {

    },
    duplicateFormula(id) {

    },
    deleteFormula(id) {
      const i = data.formulas.findIndex((f) => f.id === id);
      if (i < 0) return null;
      const [gone] = data.formulas.splice(i, 1);
      save();
      return gone;
    },
    undeleteFormula(f) { if (f && !data.formulas.some((x) => x.id === f.id)) { data.formulas.push(f); save(); } },
    trials(formulaId) {

    undeleteTrial(formulaId, t) {

    },

    batches: () => [...data.batches].sort((a, b) => (a.madeAt < b.madeAt ? 1 : -1)),

    addBatch(input) {

      const rec = {
        id: uid(),
        number: `B-${year}-${String(data.counters[year]).padStart(4, '0')}`,
        madeAt,
        expiresAt: input.shelfLifeDays ? addDays(madeAt.slice(0, 10), input.shelfLifeDays) : null,
        recipeId: input.recipeId === 'temp' ? null : input.recipeId || null,
        recipeName: str(input.recipeName, 'Recipe name', { required: true, max: 120 }),
        recipeVersion: input.recipeVersion || 1,
        volumeMl: num(input.volumeMl, 'Volume', { min: 0.001, max: 1e6, required: true }),
        initials: str(input.initials, 'Initials', { max: 8 }),
        labName: str(input.labName, 'Lab name', { max: 80 }),
        notes: str(input.notes, 'Notes', { max: 1000 }),
        ph: input.ph ?? null,
        composition: (input.composition || []).slice(0, LIMITS.ingredients),

        steps: str(input.steps, 'Method', { max: 5000 }),

    },
    deleteBatch(id) {
      const i = data.batches.findIndex((b) => b.id === id);

      save();
      return gone;
    },
    undeleteBatch(rec) { if (rec && !data.batches.some((b) => b.id === rec.id)) { data.batches.push(rec); save(); } },

    activeBench: () => data.activeBench,
    setActiveBench(s) { data.activeBench = s; save(); },
    clearActiveBench() { data.activeBench = null; save(); },

        id: `c-${uid().slice(0, 8)}`,
        name: str(r.name, 'Name', { required: true, max: 120 }),
        formula: str(r.formula, 'Formula', { max: 80 }),

      }

        const have = next.formulas.find((x) => x.id === f.id);

          have.trials.push(...extra);
        }
      }
      for (const b of report.batches) if (!next.batches.some((x) => x.id === b.id)) { next.batches.push(b); counts.batchesAdded++; }
      for (const c of report.customReagents) if (!next.customReagents.some((x) => x.id === c.id)) { next.customReagents.push(c); counts.reagentsAdded++; }

      if (mode === 'replace') next.settings = { ...next.settings, ...report.settings };
      if (next.recipes.length > LIMITS.recipes || next.batches.length > LIMITS.batches || next.formulas.length > LIMITS.formulas) throw new ValidationError('That file would exceed the size limits.');

    },
    eraseAll() { data = emptyData(); temp = null; if (storage) { try { storage.removeItem(KEY); } catch { /* ignore */ } } save(); },
    stats: () => ({ recipes: data.recipes.length, formulas: data.formulas.length, batches: data.batches.length, bytes: persistent && storage ? (storage.getItem(KEY) || '').length : 0 }),
  };

}

function formulaSnapshot(f) {
  return { name: f.name, productType: f.productType, description: f.description, batchG: f.batchG, ingredients: clone(f.ingredients), process: clone(f.process) };
}

function snapshotOf(r) {
  return { name: r.name, description: r.description, finalVolumeMl: r.finalVolumeMl, ph: r.ph, shelfLifeDays: r.shelfLifeDays, steps: r.steps, ingredients: clone(r.ingredients) };
}

// Accepts only files this app wrote, and re-validates every record, so a bad or hand-edited file cannot corrupt the app.
function validateExport(file) {
  if (!file || typeof file !== 'object' || file.app !== APP_ID) throw new ValidationError('This is not a LabKit Recipes backup file.');
  if (typeof file.schema !== 'number' || file.schema > SCHEMA) throw new ValidationError('This backup was made by a newer version of the app. Update the app first.');
  const d = file.data;
  if (!d || typeof d !== 'object') throw new ValidationError('The backup file is empty or damaged.');
  const list = (v, max) => { if (v === undefined) return []; if (!Array.isArray(v) || v.length > max) throw new ValidationError('The backup file has too many items or a damaged list.'); return v; };
  const recipes = list(d.recipes, LIMITS.recipes).map((r, n) => {
    const clean = cleanRecipe(r);
    if (typeof r.id !== 'string' || !r.id || r.id.length > 60 || r.id === 'temp') throw new ValidationError(`Recipe ${n + 1} in the file has no valid id.`);
    const history = Array.isArray(r.history) ? r.history.slice(0, LIMITS.history).flatMap((h) => { try { return [{ version: num(h.version, 'v', { int: true, min: 1, required: true }), savedAt: str(h.savedAt, 'date', { max: 40 }), snapshot: cleanRecipe(h.snapshot) }]; } catch { return []; } }) : [];
    const stamp = (v) => (typeof v === 'string' && !Number.isNaN(Date.parse(v)) ? v : nowIso());
    return { id: r.id, ...clean, version: num(r.version ?? 1, 'Version', { int: true, min: 1, required: true }), history, createdAt: stamp(r.createdAt), updatedAt: stamp(r.updatedAt), lastMadeAt: r.lastMadeAt ? stamp(r.lastMadeAt) : null };
  });
  const formulas = list(d.formulas, LIMITS.formulas).map((f, n) => {
    const clean = cleanFormula(f);
    if (typeof f.id !== 'string' || !f.id || f.id.length > 60) throw new ValidationError(`Formula ${n + 1} in the file has no valid id.`);
    const stamp = (v) => (typeof v === 'string' && !Number.isNaN(Date.parse(v)) ? v : nowIso());
    const history = Array.isArray(f.history) ? f.history.slice(0, LIMITS.history).flatMap((x) => { try { return [{ version: num(x.version, 'v', { int: true, min: 1, required: true }), savedAt: str(x.savedAt, 'date', { max: 40 }), snapshot: cleanFormula(x.snapshot) }]; } catch { return []; } }) : [];
    const seen = new Set();
    const trials = list(f.trials, LIMITS.trials).map((t, k) => {
      if (!t || typeof t.id !== 'string' || !t.id || t.id.length > 60 || seen.has(t.id)) throw new ValidationError(`A trial of formula ${n + 1} has no valid id.`);
      seen.add(t.id);

    });

  });

    if (!b || typeof b !== 'object' || typeof b.id !== 'string' || !b.id || b.id.length > 60) throw new ValidationError(`Batch ${n + 1} in the file has no valid id.`);
    if (typeof b.madeAt !== 'string' || Number.isNaN(Date.parse(b.madeAt))) throw new ValidationError(`Batch ${n + 1} has no valid date.`);
    const lines = list(b.lines, LIMITS.ingredients).map((l) => ({ name: str(l.name, 'Line name', { max: 120 }), kind: l.kind === 'volume' ? 'volume' : 'mass', target: num(l.target, 'Target', { min: 0 }), actual: num(l.actual, 'Actual', { min: 0 }), deviationPct: num(l.deviationPct, 'Deviation'), achieved: l.achieved && typeof l.achieved === 'object' ? { value: num(l.achieved.value, 'Achieved'), unit: str(l.achieved.unit, 'Unit', { max: 12 }) } : null }));
    const composition = list(b.composition, LIMITS.ingredients).map((c) => ({ name: str(c.name, 'Name', { max: 120 }), conc: num(c.conc, 'Amount', { min: 0 }), unit: str(c.unit, 'Unit', { max: 12 }) }));
    return {
      id: b.id, number: str(b.number, 'Batch number', { required: true, max: 30 }), madeAt: b.madeAt, expiresAt: b.expiresAt ? str(b.expiresAt, 'Expiry', { max: 12 }) : null,
      recipeId: b.recipeId ? str(b.recipeId, 'Recipe id', { max: 60 }) : null, recipeName: str(b.recipeName, 'Recipe name', { required: true, max: 120 }),
      recipeVersion: num(b.recipeVersion ?? 1, 'Version', { int: true, min: 1 }), volumeMl: num(b.volumeMl, 'Volume', { min: 0.001, max: 1e6, required: true }),
      initials: str(b.initials, 'Initials', { max: 8 }), labName: str(b.labName, 'Lab name', { max: 80 }), notes: str(b.notes, 'Notes', { max: 1000 }),
      ph: b.ph === null || b.ph === undefined ? null : num(b.ph, 'pH', { min: 0, max: 14 }), composition, lines, steps: str(b.steps, 'Method', { max: 5000 }),
    };
  });
  const customReagents = list(d.customReagents, LIMITS.customReagents).map((c) => ({
    id: str(c.id, 'Reagent id', { required: true, max: 40 }), name: str(c.name, 'Name', { required: true, max: 120 }), formula: str(c.formula, 'Formula', { max: 80 }),
    mw: num(c.mw, 'MW', { min: 0.001, max: 1e8 }), form: c.form === 'liquid' ? 'liquid' : 'solid', density: num(c.density, 'Density', { min: 0.01, max: 30 }),
